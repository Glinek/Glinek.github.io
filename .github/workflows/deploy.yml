name: Deploy 11ty site to GitHub Pages

on:
  push:
    branches: ["main"] # Zmień na "master", jeśli tak nazywa się Twoja główna gałąź

# Uprawnienia potrzebne do wrzucenia strony
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20" # Używamy stabilnej wersji Node.js
          
      - name: Install dependencies
        run: npm install
        
      - name: Build Eleventy
        # Odpala 11ty. Jeśli w package.json masz skrypt "build", możesz użyć "npm run build"
        run: npx @11ty/eleventy 
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site" # Domyślny folder wyjściowy 11ty. Zmień, jeśli w konfiguracji 11ty masz ustawiony inny!

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
