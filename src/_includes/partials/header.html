<link rel="stylesheet" href="/css/partials/header.css">

<header class="siteHeader">
  <div class="headerLogo">
    <a href="{{ navigation.logo.url }}">
      <img src="{{ navigation.logo.src }}" alt="{{ navigation.logo.alt }}" />
    </a>
  </div>

  <button class="hamburger" aria-label="Menu">
    <span class="hamburger-box">
      <span class="hamburger-inner"></span>
    </span>
  </button>

  <ul class="nav__list">
    {% for item in navigation.itemsHeader %}
    <li>
      <a class="linkHeader"href="{{ item.url }}" {{ helpers.getLinkActiveState(item.url, page.url) | safe }}>
        {{ item.text }}
      </a>
    </li>
    {% endfor %}
    <li>
      <a href="/#contact" class="header-cta-btn">Contact Me</a>
    </li>
  </ul>
</header>
